<!doctype html>
<html lang="uz" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>%VITE_APP_NAME% — Navoiy viloyati mehmonxonalari</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="keywords"    content="%VITE_APP_NAME%, Navoiy, mehmonxona, bron, nogironlar uchun, inklyuziv" />
    <meta name="author"      content="%VITE_APP_NAME%" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="%VITE_APP_NAME% — Navoiy viloyati mehmonxonalari" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:locale"      content="uz_UZ" />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable"       content="yes" />
    <meta name="apple-mobile-web-app-capable"  content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title"   content="%VITE_APP_NAME%" />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1120"  media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: { DEFAULT: '#4f46e5', hover: '#4338ca' }
            }
          }
        }
      }
      // Dark mode flicker oldini olish
      try {
        const dark = localStorage.getItem('darkMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark === 'true' || (dark === null && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    </script>
  </head>

  <body class="bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
