<head>

  <!-- ── Primary SEO ────────────────────────────────────────────── -->

  <meta name="author" content="NavaiTour Jamoasi" />
  <meta name="robots" content="index, follow" />

  <!-- ── Open Graph ─────────────────────────────────────────────── -->
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tourism for Everyone — Navoiy Viloyati Inklyuziv Turizm Portali" />
  <meta
    property="og:description"
    content="Navoiy viloyatidagi inklyuziv va qulay tarixiy joylar, ziyoratgohlar hamda qulay mehmonxonalar." />
  <meta property="og:description"
    content="Imkoniyati cheklangan va barcha sayohatchilar uchun Navoiyning boy tarixiy maskanlari va inklyuziv qulayliklari." />
  <meta property="og:image" content="https://tourism-for-everyone.uz/og-image.jpg" />
  <meta property="og:locale" content="uz_UZ" />

  <!-- ── Twitter Card ───────────────────────────────────────────── -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://tourism-for-everyone.uz/" />
  <meta property="twitter:title" content="Tourism for Everyone — Navoiy Viloyati Inklyuziv Turizm Platformasi" />
  <meta property="twitter:description"
    content="Navoiy viloyatidagi inklyuziv va qulay tarixiy joylar, ziyoratgohlar hamda 360° virtual turlar." />

  <!-- ── PWA / Mobile ───────────────────────────────────────────── -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tourism for Everyone" />
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- ── Canonical ──────────────────────────────────────────────── -->
  <link rel="canonical" href="https://tourism-for-everyone.uz/" />

  <!-- ── Sitemap reference ──────────────────────────────────────── -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#4f46e5', hover: '#4338ca' }
          }
        }
      }
    }
  </script>
  <script>
    try {
      const dark = localStorage.getItem('darkMode');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark === 'true' || (dark === null && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) { }
  </script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-slate-50 text-slate-900 transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">
  <div id="root"></div>

</body>

</html>
